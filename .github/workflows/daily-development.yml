name: Stage 6 - Gemini Multi-Task Developer

on:
  workflow_dispatch:
    inputs:
      task_count:
        description: "Number of microtasks Gemini should attempt"
        required: true
        default: "2"

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "gireeshpatgar17"
          git config user.email "142138870+gireeshpatgar17@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Record starting commit
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run Gemini autonomous developer
        id: gemini
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

          # Explicitly pin the model instead of using the CLI default.
          gemini_model: gemini-3.8-flash

          # Prevent an uncontrolled long-running agent session.
          settings: |
            {
              "model": {
                "maxSessionTurns": 10
              }
            }

          prompt: |
            You are the autonomous developer for this repository.

            Read these files before doing anything:
            - GEMINI.md
            - PROJECT_PLAN.md
            - AGENT_RULES.md

            Your goal during this run is to complete UP TO
            ${{ inputs.task_count }}
            meaningful microtasks for the Resume/JD Matcher project.

            IMPORTANT EXECUTION RULES:

            1. Work on ONE microtask at a time.

            2. Select the next useful incomplete task from PROJECT_PLAN.md
               based on the current state of the repository.

            3. Each microtask must:
               - contribute meaningfully to the Resume/JD Matcher
               - be small and focused
               - preserve existing functionality
               - include appropriate tests or validation where practical

            4. After implementing EACH microtask:
               - inspect the changes
               - run appropriate tests or validation
               - fix small problems if necessary

            5. ONLY when that microtask is successfully validated:
               stage ONLY the files belonging to that microtask and create
               ONE Git commit.

            6. Use a clear conventional commit message such as:
               feat: add PDF resume text extraction
               test: add text cleaning tests
               refactor: organize resume parser module

            7. Therefore:
               ONE completed microtask = ONE Git commit.

            8. DO NOT push commits.
               The GitHub Actions workflow will push them after you finish.

            9. NEVER modify:
               - .github/workflows/*
               - GEMINI.md
               - AGENT_RULES.md

            10. Do not:
                - make meaningless edits
                - make whitespace-only changes
                - create fake contribution commits
                - force push
                - rewrite Git history
                - expose secrets
                - modify GitHub settings

            11. If a microtask fails:
                - revert its uncommitted changes
                - do not commit it
                - stop if continuing would be unsafe

            12. Do not combine multiple microtasks into one commit.

            13. Stop when either:
                - ${{ inputs.task_count }} successful microtasks have been
                  completed and committed, OR
                - no safe meaningful microtask can currently be completed.

            Work autonomously. Inspect the repository before choosing tasks.

      # If Gemini hits quota halfway through, previously completed commits
      # remain, while incomplete uncommitted work is removed.
      - name: Remove unfinished changes
        if: always()
        run: |
          git reset --hard HEAD
          git clean -fd -e gemini-artifacts/

      - name: Verify autonomous commits
        if: always()
        run: |
          echo "Starting commit: $BASE_SHA"
          echo "Current commit:  $(git rev-parse HEAD)"

          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          echo "Gemini completed $COMMIT_COUNT commit(s)."

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No completed microtasks were committed."
            exit 0
          fi

          echo ""
          echo "Commits created:"
          git log --oneline "$BASE_SHA"..HEAD

          echo ""
          echo "Files changed:"
          git diff --name-only "$BASE_SHA"..HEAD

      - name: Safety check protected files
        if: always()
        run: |
          if [ "$(git rev-list --count "$BASE_SHA"..HEAD)" -eq 0 ]; then
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"..HEAD)

          if echo "$CHANGED_FILES" | grep -E \
            '^(\.github/workflows/|GEMINI\.md$|AGENT_RULES\.md$)'; then

            echo "ERROR: Gemini modified a protected automation file."
            echo "No autonomous commits will be pushed."

            git reset --hard "$BASE_SHA"
            exit 1
          fi

      - name: Push completed microtasks
        if: always()
        run: |
          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "Nothing to push."
            exit 0
          fi

          echo "Pushing $COMMIT_COUNT completed microtask commit(s)..."
          git push origin HEAD:${{ github.ref_name }}
