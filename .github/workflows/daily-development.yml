name: Daily Autonomous Development

on:
  # Automatic daily run.
  # GitHub uses the repository's timezone unless timezone is specified.
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"

  # Keep manual execution available for testing.
  workflow_dispatch:
    inputs:
      task_count:
        description: "Number of microtasks (1-7)"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "gireeshpatgar17"
          git config user.email "142138870+gireeshpatgar17@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Select daily task count
        id: tasks
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ -n "${{ inputs.task_count }}" ]; then
            TASK_COUNT="${{ inputs.task_count }}"
          else
            TASK_COUNT=$(( RANDOM % 7 + 1 ))
          fi

          if ! [[ "$TASK_COUNT" =~ ^[1-7]$ ]]; then
            echo "Invalid task count: $TASK_COUNT"
            exit 1
          fi

          echo "Today's microtask target: $TASK_COUNT"
          echo "task_count=$TASK_COUNT" >> "$GITHUB_OUTPUT"

      - name: Record starting commit
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run Gemini autonomous developer
        id: gemini
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite

          settings: |
            {
              "model": {
                "maxSessionTurns": 20
              }
            }

          prompt: |
            You are the autonomous developer for this repository.

            First read:
            - GEMINI.md
            - PROJECT_PLAN.md
            - AGENT_RULES.md

            Today's target is:
            ${{ steps.tasks.outputs.task_count }} microtasks.

            Your job is to progressively develop the actual
            Resume/JD Matcher project.

            RULES:

            1. Inspect the current repository before choosing work.

            2. Select meaningful incomplete tasks from PROJECT_PLAN.md.

            3. Work on ONE microtask at a time.

            4. Each microtask must:
               - meaningfully improve the project
               - be small and focused
               - preserve existing functionality
               - be testable

            5. After each microtask:
               - inspect the changes
               - run appropriate tests/validation
               - fix reasonable problems

            6. After successful validation, create ONE Git commit
               for that microtask.

            7. One microtask = one commit.

            8. DO NOT push anything.
               GitHub Actions will push the commits.

            9. NEVER modify:
               - .github/workflows/*
               - GEMINI.md
               - AGENT_RULES.md

            10. NEVER:
                - create meaningless commits
                - make whitespace-only changes
                - fabricate project progress
                - force push
                - rewrite history
                - expose secrets

            11. If a task cannot be safely completed:
                revert its uncommitted changes and move on only if safe.

            12. Stop when:
                - the requested number of meaningful tasks is completed, OR
                - no safe meaningful task remains, OR
                - the Gemini/API quota prevents continued work.

            Do not manufacture work merely to reach the task count.

      - name: Remove unfinished changes
        if: always()
        run: |
          git reset --hard HEAD
          git clean -fd -e gemini-artifacts/

      - name: Safety check protected files
        if: always()
        run: |
          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No commits were created."
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"..HEAD)

          if echo "$CHANGED_FILES" | grep -E \
            '^(\.github/workflows/|GEMINI\.md$|AGENT_RULES\.md$)'; then
            echo "ERROR: Protected file was modified."
            git reset --hard "$BASE_SHA"
            exit 1
          fi

      - name: Show completed work
        if: always()
        run: |
          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          echo "========================================"
          echo "Daily autonomous development summary"
          echo "Target: ${{ steps.tasks.outputs.task_count }}"
          echo "Completed commits: $COMMIT_COUNT"
          echo "========================================"

          if [ "$COMMIT_COUNT" -gt 0 ]; then
            git log --oneline "$BASE_SHA"..HEAD
          fi

      - name: Push completed work
        if: always()
        run: |
          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "Nothing to push."
            exit 0
          fi

          git push origin HEAD:${{ github.event.repository.default_branch }}
