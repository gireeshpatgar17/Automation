name: Daily Autonomous Development

on:
  workflow_dispatch:
    inputs:
      task_count:
        description: "Number of tasks to complete"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  autonomous-development:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "gireeshpatgar17"
          git config user.email "142138870+gireeshpatgar17@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Record starting commit
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Gemini autonomous developer
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.7-flash
          settings: |-
            {
              "general": {
                "maxAttempts": 1
              },
              "model": {
                "maxSessionTurns": 10,
                "summarizeToolOutput": {
                  "run_shell_command": {
                    "tokenBudget": 1000
                  }
                }
              }
            }
          prompt: |
            You are the autonomous software engineer for this repository.

            Your goal is to complete EXACTLY ONE small, meaningful,
            currently incomplete development task.

            IMPORTANT:
            - Work on ONE task only.
            - Do not search for additional tasks after choosing one.
            - Do not make unrelated improvements.
            - Do not modify workflow files.
            - Do not modify GEMINI.md.
            - Do not modify AGENT_RULES.md.
            - Do not modify PROJECT_PLAN.md.
            - Do not modify secrets, repository settings, or GitHub configuration.
            - Do not push; the workflow will push your commit.
            - Do not rewrite Git history.
            - Do not create an empty or meaningless commit.

            FIRST:
            1. Read PROJECT_PLAN.md.
            2. Read AGENT_RULES.md.
            3. Inspect only the files relevant to the selected task.

            TASK SELECTION:
            - Choose the smallest useful unfinished task from PROJECT_PLAN.md.
            - Prefer a task that can realistically be completed and tested
              within this single session.
            - Do not start a large feature.
            - Do not redesign existing architecture unless the selected task
              explicitly requires it.

            IMPLEMENTATION:
            - Make the smallest clean implementation that completes the task.
            - Follow the existing project structure and coding style.
            - Add or update tests when appropriate.
            - Do not add unnecessary dependencies.

            TESTING:
            - Run the relevant tests.
            - If the relevant tests fail because of your implementation,
              fix the implementation and test again.
            - Do not spend the session fixing unrelated pre-existing problems.

            GIT:
            - Create EXACTLY ONE commit if meaningful work was completed.
            - Use a conventional commit message:
              feat:, fix:, test:, refactor:, or docs:.
            - Ensure all changes belonging to the task are included.
            - Do not leave generated build artifacts or temporary files.

            STOP:
            After the task is implemented, tested, and committed, STOP.
            Do not begin another task.

      - name: Clean generated files
        if: always()
        run: |
          rm -rf src/*.egg-info
          rm -rf *.egg-info
          rm -rf .pytest_cache
          rm -rf htmlcov
          rm -f .coverage

      - name: Verify completed work
        if: always()
        run: |
          echo "========================================"
          echo "Daily Autonomous Development"
          echo "========================================"

          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          echo "Starting commit: $BASE_SHA"
          echo "New commits: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo ""
            echo "Commits created:"
            git log --oneline "$BASE_SHA"..HEAD
          fi

          echo ""
          echo "Working tree:"
          git status --short

      - name: Push completed work
        if: always()
        run: |
          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No completed task to push."
            exit 0
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Agent left uncommitted changes."
            git status --short
            exit 1
          fi

          if [ "$COMMIT_COUNT" -gt 1 ]; then
            echo "ERROR: Agent created more than one commit."
            git log --oneline "$BASE_SHA"..HEAD
            exit 1
          fi

          echo "Pushing completed commit..."
          git push origin HEAD:${{ github.event.repository.default_branch }}
