name: Random Daily Scheduler

on:
  schedule:
    # Check every 15 minutes.
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest

    steps:
      - name: Calculate today's random execution time
        shell: bash
        run: |
          set -e

          # Current date in India.
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          # Create a deterministic pseudo-random number from today's date.
          # This means the same day always produces the same target time,
          # while different days produce different times.
          SEED=$(printf '%s' "$TODAY" | sha256sum | cut -c1-8)

          NUMBER=$((16#$SEED))

          # 8:00 AM to 10:45 PM = 59 possible 15-minute slots.
          SLOT=$((NUMBER % 60))

          TOTAL_MINUTES=$((8 * 60 + SLOT * 15))

          TARGET_HOUR=$((TOTAL_MINUTES / 60))
          TARGET_MINUTE=$((TOTAL_MINUTES % 60))

          printf -v TARGET_TIME "%02d:%02d" \
            "$TARGET_HOUR" "$TARGET_MINUTE"

          echo "========================================"
          echo "Random Daily Scheduler Test"
          echo "Date:        $TODAY"
          echo "Target time: $TARGET_TIME IST"
          echo "Window:      08:00 - 22:45 IST"
          echo "========================================"
