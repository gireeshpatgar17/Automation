name: Random Daily Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  schedule-check:
    runs-on: ubuntu-latest

    steps:
      - name: Calculate today's target time
        id: target
        shell: bash
        run: |
          set -e

          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          SEED=$(printf '%s' "$TODAY" | sha256sum | cut -c1-8)
          NUMBER=$((16#$SEED))

          # 60 possible 15-minute slots:
          # 08:00 through 22:45 IST
          SLOT=$((NUMBER % 60))

          TOTAL_MINUTES=$((8 * 60 + SLOT * 15))

          TARGET_HOUR=$((TOTAL_MINUTES / 60))
          TARGET_MINUTE=$((TOTAL_MINUTES % 60))

          printf -v TARGET_TIME "%02d:%02d" \
            "$TARGET_HOUR" "$TARGET_MINUTE"

          CURRENT_HOUR=$(TZ=Asia/Kolkata date +%H)
          CURRENT_MINUTE=$(TZ=Asia/Kolkata date +%M)

          CURRENT_TOTAL=$((10#$CURRENT_HOUR * 60 + 10#$CURRENT_MINUTE))

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "target_time=$TARGET_TIME" >> "$GITHUB_OUTPUT"
          echo "target_minutes=$TOTAL_MINUTES" >> "$GITHUB_OUTPUT"
          echo "current_minutes=$CURRENT_TOTAL" >> "$GITHUB_OUTPUT"

          echo "Today's target: $TARGET_TIME IST"
          echo "Current time:   $CURRENT_HOUR:$CURRENT_MINUTE IST"

      - name: Trigger development workflow
        if: steps.target.outputs.current_minutes == steps.target.outputs.target_minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Target time reached."
          echo "Starting autonomous development workflow..."

          gh workflow run daily-development.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"

          echo "Development workflow triggered."

      - name: Wait for today's target
        if: steps.target.outputs.current_minutes != steps.target.outputs.target_minutes
        run: |
          echo "Today's target time:"
          echo "${{ steps.target.outputs.target_time }} IST"

          echo "Current time:"
          TZ=Asia/Kolkata date '+%H:%M IST'

          echo "Not time yet. Nothing will be triggered."
