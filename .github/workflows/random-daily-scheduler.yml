name: Random Daily Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      force_run:
        description: "Trigger development immediately for testing"
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  schedule-development:
    runs-on: ubuntu-latest

    steps:
      - name: Calculate today's execution time
        id: calculate
        shell: bash
        run: |
          set -e

          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          SEED=$(printf '%s' "$TODAY" | sha256sum | cut -c1-8)
          NUMBER=$((16#$SEED))

          # 60 possible 15-minute slots:
          # 08:00 through 22:45
          SLOT=$((NUMBER % 60))

          TOTAL_MINUTES=$((8 * 60 + SLOT * 15))

          TARGET_HOUR=$((TOTAL_MINUTES / 60))
          TARGET_MINUTE=$((TOTAL_MINUTES % 60))

          printf -v TARGET_TIME "%02d:%02d" \
            "$TARGET_HOUR" "$TARGET_MINUTE"

          CURRENT_HOUR=$(TZ=Asia/Kolkata date +%H)
          CURRENT_MINUTE=$(TZ=Asia/Kolkata date +%M)

          CURRENT_TOTAL=$((10#$CURRENT_HOUR * 60 + 10#$CURRENT_MINUTE))
          TARGET_TOTAL=$TOTAL_MINUTES

          echo "Today: $TODAY"
          echo "Target time: $TARGET_TIME IST"
          echo "Current time: ${CURRENT_HOUR}:${CURRENT_MINUTE} IST"

          echo "target_time=$TARGET_TIME" >> "$GITHUB_OUTPUT"

          # Manual forced test
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.force_run }}" = "true" ]; then

            echo "run_now=true" >> "$GITHUB_OUTPUT"
            echo "FORCE RUN enabled — triggering development workflow."

          # Normal scheduled execution
          elif [ "$CURRENT_TOTAL" -ge "$TARGET_TOTAL" ] && \
               [ "$CURRENT_TOTAL" -lt "$((TARGET_TOTAL + 15))" ]; then

            echo "run_now=true" >> "$GITHUB_OUTPUT"
            echo "It is today's execution window."

          else

            echo "run_now=false" >> "$GITHUB_OUTPUT"
            echo "Not today's execution window."

          fi

      - name: Select daily task count
        id: tasks
        if: steps.calculate.outputs.run_now == 'true'
        shell: bash
        run: |
          # Deterministically choose 1-7 tasks for today's run.
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          SEED=$(printf '%s-task-count' "$TODAY" | sha256sum | cut -c1-8)
          NUMBER=$((16#$SEED))

          TASK_COUNT=$((NUMBER % 7 + 1))

          echo "Today's autonomous task count: $TASK_COUNT"
          echo "task_count=$TASK_COUNT" >> "$GITHUB_OUTPUT"

      - name: Trigger autonomous development
        if: steps.calculate.outputs.run_now == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TASK_COUNT="${{ steps.tasks.outputs.task_count }}"

          echo "Triggering Daily Autonomous Development"
          echo "Repository: ${{ github.repository }}"
          echo "Task count: $TASK_COUNT"

          gh workflow run "daily-development.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f task_count="$TASK_COUNT"

      - name: Scheduler status
        shell: bash
        run: |
          echo "========================================"
          echo "Random Daily Scheduler"
          echo "========================================"
          echo "Target: ${{ steps.calculate.outputs.target_time }} IST"
          echo "Run now: ${{ steps.calculate.outputs.run_now }}"

          if [ "${{ steps.calculate.outputs.run_now }}" = "true" ]; then
            echo "Development workflow has been triggered."
          else
            echo "No development run triggered this check."
          fi
