name: Daily Auto Commit

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config user.name "gireeshpatgar17"
          git config user.email "142138870+gireeshpatgar17@users.noreply.github.com"

      - name: Update development log
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          mkdir -p .github

          echo "- $DATE: Automated repository maintenance." >> .github/development-log.md

      - name: Commit changes
        run: |
          git add .github/development-log.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update development log"
          git push
