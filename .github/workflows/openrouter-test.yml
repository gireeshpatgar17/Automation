name: OpenRouter Coding Agent Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "gireeshpatgar17"
          git config user.email "142138870+gireeshpatgar17@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Record starting commit
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Configure OpenCode
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "openrouter": {
                "options": {
                  "apiKey": "{env:OPENROUTER_API_KEY}"
                },
                "models": {
                  "qwen/qwen3-coder:free": {}
                }
              }
            }
          }
          EOF

          echo "OpenCode configuration created."

      - name: Verify OpenCode model
        run: |
          opencode models openrouter --refresh

      - name: Test available free OpenRouter models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e

          echo "Fetching currently available free models..."

          curl -fsS \
            https://openrouter.ai/api/v1/models \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -o /tmp/models.json

          python - <<'PY'
          import json

          with open("/tmp/models.json") as f:
              data = json.load(f)

          models = data.get("data", [])

          print("\nFREE MODELS:\n")

          count = 0

          for model in models:
              pricing = model.get("pricing", {})
              prompt = pricing.get("prompt")
              completion = pricing.get("completion")

              if prompt == "0" and completion == "0":
                  model_id = model.get("id", "")
                  name = model.get("name", "")

                  print(f"{model_id}  |  {name}")
                  count += 1

          print(f"\nTotal free models found: {count}")
          PY

      - name: Remove temporary OpenCode configuration
        if: always()
        run: |
          rm -f opencode.json

      - name: Show completed work
        if: always()
        run: |
          echo "========================================"
          echo "OpenRouter Coding Agent Test"
          echo "========================================"

          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          echo "Starting commit: $BASE_SHA"
          echo "Completed commits: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo ""
            echo "New commits:"
            git log --oneline "$BASE_SHA"..HEAD
          fi

          echo ""
          echo "Working tree:"
          git status --short

      - name: Push completed work
        if: always()
        run: |
          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No completed task to push."
            exit 0
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Agent left uncommitted changes."
            git status --short
            exit 1
          fi

          echo "Pushing $COMMIT_COUNT completed commit(s)..."

          git push origin HEAD:${{ github.event.repository.default_branch }}
