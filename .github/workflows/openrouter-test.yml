name: OpenRouter Coding Agent Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "gireeshpatgar17"
          git config user.email "142138870+gireeshpatgar17@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Record starting commit
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Configure OpenCode
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "openrouter": {
                "options": {
                  "apiKey": "{env:OPENROUTER_API_KEY}"
                },
                "models": {
                  "deepseek/deepseek-chat-v3.1:free": {}
                }
              }
            }
          }
          EOF

          echo "OpenCode configuration created."

      - name: Verify OpenCode model
        run: |
          opencode models openrouter --refresh

      - name: Run DeepSeek coding agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          opencode run \
            --model "openrouter/deepseek/deepseek-chat-v3.1:free" \
            --auto \
            "You are working on the Resume/JD Matcher project.

            First read:
            - GEMINI.md
            - PROJECT_PLAN.md
            - AGENT_RULES.md

            Complete EXACTLY ONE very small, meaningful,
            currently incomplete project task.

            IMPORTANT:
            Keep the task extremely narrowly scoped.

            Do not explore unrelated parts of the repository.
            Do not redesign existing architecture.
            Do not implement multiple tasks.

            Your process:
            1. Inspect only files relevant to the selected task.
            2. Implement the task.
            3. Run the relevant test or validation.
            4. Fix small failures if necessary.
            5. Create ONE Git commit.
            6. Stop.

            Rules:
            - One task = one commit.
            - Do not push.
            - Do not modify .github/workflows/*
            - Do not modify GEMINI.md.
            - Do not modify AGENT_RULES.md.
            - Do not create meaningless changes.
            - Do not create whitespace-only commits.
            - Do not expose secrets.
            - Do not rewrite Git history.
            - Do not force push.

            If no safe meaningful task can be completed,
            make no changes and explain why."

      - name: Remove temporary OpenCode configuration
        if: always()
        run: |
          rm -f opencode.json

      - name: Show completed work
        if: always()
        run: |
          echo "========================================"
          echo "OpenRouter Coding Agent Test"
          echo "========================================"

          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          echo "Starting commit: $BASE_SHA"
          echo "Completed commits: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo ""
            echo "New commits:"
            git log --oneline "$BASE_SHA"..HEAD
          fi

          echo ""
          echo "Working tree:"
          git status --short

      - name: Push completed work
        if: always()
        run: |
          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No completed task to push."
            exit 0
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Agent left uncommitted changes."
            git status --short
            exit 1
          fi

          echo "Pushing $COMMIT_COUNT completed commit(s)..."

          git push origin HEAD:${{ github.event.repository.default_branch }}
