name: OpenRouter Coding Agent Test


on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "gireeshpatgar17"
          git config user.email "142138870+gireeshpatgar17@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Record starting commit
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Configure OpenCode
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "openrouter": {
                "options": {
                  "apiKey": "{env:OPENROUTER_API_KEY}"
                },
                "models": {
                  "nvidia/nemotron-3-super-120b-a12b:free": {}
                }
              }
            }
          }
          EOF

          echo "OpenCode configuration created."

      - name: Verify OpenCode model
        run: |
          opencode models openrouter --refresh

      - name: Test Nemotron directly
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e

          echo "Testing Nemotron 3 Super directly..."

          curl -fsS \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "nvidia/nemotron-3-super-120b-a12b:free",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: NEMOTRON_TEST_OK"
                }
              ],
              "max_tokens": 20
            }' \
            -o /tmp/nemotron-response.json

          echo "----- RESPONSE -----"
          cat /tmp/nemotron-response.json

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Nemotron coding agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          opencode run \
            --model "openrouter/nvidia/nemotron-3-super-120b-a12b:free" \
            --auto \
            "You are working on the Resume/JD Matcher project.

            Complete EXACTLY ONE very small, meaningful, currently incomplete project task.

            Before making changes:
            - Read GEMINI.md.
            - Read PROJECT_PLAN.md.
            - Read AGENT_RULES.md.
            - Briefly inspect the existing project structure.

            Rules:
            - Choose one small incomplete task from the existing project plan.
            - Do not modify .github/workflows/*.
            - Do not modify GEMINI.md.
            - Do not modify AGENT_RULES.md.
            - Do not modify unrelated files.
            - Implement real functionality, not cosmetic or meaningless changes.
            - Run appropriate tests after implementation.
            - Fix the implementation if tests fail.
            - Create EXACTLY ONE Git commit after successful completion.
            - Use a conventional commit message such as feat:, fix:, test:, refactor:, or docs:.
            - Use the Git identity already configured in the repository.
            - Do NOT push.
            - Do NOT create empty commits.
            - Do NOT rewrite Git history.
            - If you cannot safely complete a meaningful task, make no commit."

      - name: Clean generated files
        if: always()
        run: |
          rm -rf src/*.egg-info
          rm -rf *.egg-info
          rm -rf .pytest_cache

      - name: Remove temporary OpenCode configuration
        if: always()
        run: |
          rm -f opencode.json

      - name: Show completed work
        if: always()
        run: |
          echo "========================================"
          echo "OpenRouter Coding Agent Test"
          echo "========================================"

          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          echo "Starting commit: $BASE_SHA"
          echo "Completed commits: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo ""
            echo "New commits:"
            git log --oneline "$BASE_SHA"..HEAD
          fi

          echo ""
          echo "Working tree:"
          git status --short

      - name: Push completed work
        if: always()
        run: |
          COMMIT_COUNT=$(git rev-list --count "$BASE_SHA"..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No completed task to push."
            exit 0
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Agent left uncommitted changes."
            git status --short
            exit 1
          fi

          echo "Pushing $COMMIT_COUNT completed commit(s)..."

          git push origin HEAD:${{ github.event.repository.default_branch }}
