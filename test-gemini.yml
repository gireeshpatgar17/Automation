name: Test Gemini Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are testing the autonomous development environment.

            Do NOT modify any files.
            Do NOT create any files.
            Do NOT commit anything.
            Do NOT push anything.

            Inspect the repository and report:

            1. The current repository structure.
            2. The purpose of the project based on README.md,
               GEMINI.md, PROJECT_PLAN.md and AGENT_RULES.md.
            3. The first three sensible development tasks.
            4. Whether the repository is ready for autonomous
               development.

            This is a READ-ONLY test.
